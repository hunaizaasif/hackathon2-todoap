# Production Environment Values
replicaCount: 3

image:
  repository: phase3-frontend
  pullPolicy: IfNotPresent
  tag: "v1.0.0"

env:
  - name: NEXT_PUBLIC_API_URL
    value: "https://api.yourdomain.com"
  - name: NODE_ENV
    value: "production"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
