apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: hackathon.local
    http:
      paths:
      # Backend API routes
      - path: /api(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: backend
            port:
              number: 7860
      # MCP Server routes
      - path: /mcp(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: mcp-server
            port:
              number: 7860
      # Frontend (catch-all, must be last)
      - path: /()(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: frontend
            port:
              number: 3000
