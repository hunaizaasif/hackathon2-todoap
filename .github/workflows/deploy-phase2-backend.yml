name: Deploy to Hugging Face Spaces

on:
  push:
    branches:
      - main
    paths:
      - 'phase-2/**'
  workflow_dispatch:  # Manual trigger option

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Prepare deployment files
        working-directory: phase-2
        run: |
          # Copy HF README
          cp README_HF.md README.md

          # Verify required files exist
          echo "Checking required files..."
          for file in Dockerfile main.py pyproject.toml uv.lock alembic.ini; do
            if [ ! -f "$file" ]; then
              echo "Error: $file not found"
              exit 1
            fi
          done

          # Verify required directories exist
          for dir in src alembic; do
            if [ ! -d "$dir" ]; then
              echo "Error: $dir directory not found"
              exit 1
            fi
          done

          echo "All required files present ✓"

      - name: Push to Hugging Face Spaces
        working-directory: phase-2
        env:
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Configure git
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"

          # Setup HF repository URL with token
          HF_REPO="https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

          # Initialize a fresh git repo for deployment
          rm -rf .git
          git init
          git checkout -b main

          # Add files for deployment
          git add README.md Dockerfile main.py pyproject.toml uv.lock alembic.ini
          git add src/ alembic/

          # Commit
          git commit -m "Deploy from GitHub Actions - $(date +'%Y-%m-%d %H:%M:%S')"

          # Push to HF
          git push --force ${HF_REPO} main

          echo "✓ Successfully deployed to Hugging Face Spaces"
          echo "Visit: https://huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}"

      - name: Deployment Summary
        if: success()
        run: |
          echo "## 🚀 Deployment Successful!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Your Phase 2 Todo API has been deployed to Hugging Face Spaces." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Space URL:** https://huggingface.co/spaces/${{ secrets.HF_USERNAME }}/${{ secrets.HF_SPACE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**API Endpoints:**" >> $GITHUB_STEP_SUMMARY
          echo "- Health: https://${{ secrets.HF_USERNAME }}-${{ secrets.HF_SPACE_NAME }}.hf.space/health" >> $GITHUB_STEP_SUMMARY
          echo "- Docs: https://${{ secrets.HF_USERNAME }}-${{ secrets.HF_SPACE_NAME }}.hf.space/docs" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "⏱️ Build time: 2-5 minutes" >> $GITHUB_STEP_SUMMARY

      - name: Deployment Failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for error details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Common issues:**" >> $GITHUB_STEP_SUMMARY
          echo "- Missing GitHub Secrets (HF_USERNAME, HF_SPACE_NAME, HF_TOKEN)" >> $GITHUB_STEP_SUMMARY
          echo "- Invalid Hugging Face token" >> $GITHUB_STEP_SUMMARY
          echo "- Space does not exist on Hugging Face" >> $GITHUB_STEP_SUMMARY
